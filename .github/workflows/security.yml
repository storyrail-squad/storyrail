name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history

      # gitleaks-action fails on a branch's first push (it scans "<first>^..<last>" and the
      # root commit has no parent), so run the CLI over the full history instead.
      - name: Scan full git history for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" git /repo --redact --no-banner -v

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_VERSION: "1.180.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pipx is preinstalled on ubuntu-latest and sidesteps PEP 668 (externally-managed system Python).
      - name: Install Semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"

      # Registry rulesets + the repo's offline rules in .semgrep/ (critical patterns for this stack).
      - name: Scan
        run: |
          semgrep scan --metrics off --disable-version-check \
            --config p/default --config p/javascript --config p/secrets --config p/github-actions \
            --config .semgrep/ \
            --sarif --output semgrep.sarif
          errors=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          total=$(jq '[.runs[].results[]] | length' semgrep.sarif)
          echo "Semgrep: $total finding(s), $errors at ERROR severity"
          echo "### Semgrep: $total finding(s), $errors blocking (ERROR)" >> "$GITHUB_STEP_SUMMARY"
          test "$errors" -eq 0

      - name: Upload Semgrep SARIF
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  workflow-lint:
    name: Workflow lint (actionlint + shellcheck, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_PY_VERSION: "1.7.7.23"
      SHELLCHECK_PY_VERSION: "0.11.0.1"
      ZIZMOR_VERSION: "1.30.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pipx is preinstalled on ubuntu-latest and sidesteps PEP 668 (externally-managed system Python).
      - name: Install linters
        run: |
          pipx install "actionlint-py==${ACTIONLINT_PY_VERSION}"
          pipx install "shellcheck-py==${SHELLCHECK_PY_VERSION}"
          pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: actionlint (runs shellcheck on every run script)
        run: actionlint -color

      - name: zizmor
        run: zizmor --offline --min-severity low .github/workflows
